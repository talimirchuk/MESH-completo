<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MESH</title>
    <link class="css-path" rel="stylesheet" href="../css/primera.css">
</head>
<body>
  <!-- LADO IZQUIERDO -->
    <div class="lado-izquierdo">
        <!-- logo fijado arriba a la izquierda proporcional -->
        <div class="logo-contenedor">
            <div class="caja-blanca-logo"></div>
            <h1 class="titulo-logo">MESH</h1>
        </div>

        <!-- circulos decorativos -->
        <div class="circulo circulo-arriba"></div>
        <div class="circulo circulo-centro"></div>
        <div class="circulo circulo-abajo-peq"></div>
        <div class="circulo circulo-abajo-izq"></div>

        <!-- texto principal en el centro -->
        <div class="contenido-izq">
            <p class="frase-principal">Registrá, organizá y seguí tu salud.</p>
        </div>
    </div>

    <!-- LADO DERECHO -->
    <div class="lado-derecho">
        <div class="botones-inicio">
            <button id="cuenta" class="btn-principal">Crear cuenta</button>
            <button id="sesion" class="btn-principal">Iniciar sesión</button>
        </div>
    </div>
    <script src="../js/primera.js"></script>
</body>
</html>
